name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: debug module context
        run: |
          pwd
          git ls-files
          mise exec -- go env GOMOD GOWORK GOFLAGS
      - run: mise run test
      - run: mise run test
